#
# The v8-jsi Release pipeline entry point.
# It releases NuGet packages to the public ms/react-native ADO feed and to the Office feed,
# and, only when a manual run asks for it, the LibNode packages to nuget.org.
#

name: v8jsi_release_0.0.$(Date:yyMM.d)$(Rev:rrr)

# Runs only when microsoft.v8-jsi.ci completes on main (see resources below);
# triggers are defined here, not in the ADO pipeline UI.
trigger: none
pr: none

parameters:
# nuget.org versions are permanent, so the LibNode nuget.org job exists only in
# a manual run that sets this; the automatic runs after each CI never have it.
# Pick the CI run to publish under Resources when queuing the run.
- name: publishLibNodeToNuGetOrg
  displayName: Publish LibNode to nuget.org
  type: boolean
  default: false

resources:
  pipelines:
  - pipeline: microsoft.v8-jsi.ci
    project: ISS
    source: microsoft.v8-jsi.ci
    trigger:
      branches:
        include:
        - main

  repositories:
  - repository: CustomPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@CustomPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      vmImage: windows-latest
      os: windows

    stages:
    - stage: publish_nugets
      displayName: Publish V8Jsi NuGets

      jobs:
      # =====================================================================
      # Node.js-source package: Microsoft.JavaScript.V8. Consumes the
      # published-packages-new artifact (produced by the V8JsiCreateNugetNew CI
      # aggregator) and pushes Microsoft.JavaScript.V8.* to the
      # ms/react-native-public and office feeds, plus its symbols to the Symbol
      # Server.
      # =====================================================================
      - job: ms_react_native_nuget_job_new
        displayName: Publish Nuget (Microsoft.JavaScript.V8) to ms/react-native-public
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: published-packages-new
            targetPath: $(Pipeline.Workspace)\published-packages-new

        steps:
        - template: .ado/templates/publish-nuget-to-ado-feed.yml@self
          parameters:
            endpointId: '29e4c04c-ae69-4453-b9f3-bfef7a4c8d32'
            nugetFeedUrl: 'https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/nuget/v3/index.json'
            packageParentPath: '$(Pipeline.Workspace)/published-packages-new'
            packagesToPush: '$(Pipeline.Workspace)/published-packages-new/Microsoft.JavaScript.V8.*.nupkg'
            publishFeedCredentials: 'Nuget - ms/react-native-public'
            feedDisplayName: 'ms/react-native-public'

      - job: office_nuget_job_new
        displayName: Publish Nuget (Microsoft.JavaScript.V8) to office
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: published-packages-new
            targetPath: $(Pipeline.Workspace)\published-packages-new

        steps:
        - template: .ado/templates/publish-nuget-to-office-feed.yml@self
          parameters:
            packageParentPath: $(Pipeline.Workspace)\published-packages-new
            packagesToPush: $(Pipeline.Workspace)/published-packages-new/Microsoft.JavaScript.V8.*.nupkg

      - job: publish_symbols_job_new
        displayName: Publish PDB Symbols (Microsoft.JavaScript.V8) to Symbol Server
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          # Consume the per-arch build artifacts directly — the signed v8jsi.dll +
          # PDB from each Release cell, and the signed sandbox binaries + PDBs —
          # the same bits the NuGet aggregator packs. Build once, sign once, reuse;
          # no dependence on a build.ts-staged symbols/ dir. Each artifact lands in
          # its own subfolder under a shared symbols/ root.
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_x64_Release-new
            targetPath: $(Pipeline.Workspace)\symbols\Desktop_x64_Release-new
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_x86_Release-new
            targetPath: $(Pipeline.Workspace)\symbols\Desktop_x86_Release-new
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_ARM64_Release-new
            targetPath: $(Pipeline.Workspace)\symbols\Desktop_ARM64_Release-new
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: sandbox-binaries-win-x64
            targetPath: $(Pipeline.Workspace)\symbols\sandbox-binaries-win-x64
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: sandbox-binaries-win-x86
            targetPath: $(Pipeline.Workspace)\symbols\sandbox-binaries-win-x86
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: sandbox-binaries-win-arm64
            targetPath: $(Pipeline.Workspace)\symbols\sandbox-binaries-win-arm64

        steps:
        - pwsh: |
            $symbolsDir = "$(Pipeline.Workspace)/symbols"
            $pdbs = Get-ChildItem $symbolsDir -Recurse -Filter "*.pdb"
            Write-Host "Found $($pdbs.Count) PDB file(s) under $symbolsDir`:"
            foreach ($pdb in $pdbs) {
              Write-Host "  $($pdb.FullName) ($([math]::Round($pdb.Length / 1MB, 2)) MB)"
            }
            if ($pdbs.Count -eq 0) {
              Write-Host "##vso[task.logissue type=warning]No PDB files found in downloaded artifacts"
            }
          displayName: Inspect downloaded symbols

        - template: .ado/templates/publish-symbols.yml@self
          parameters:
            symbolsArtifactName: V8Jsi-Symbols-New-$(Build.BuildId)

      # =====================================================================
      # Microsoft.JavaScript.LibNode. Consumes the libnode-packages artifact
      # (the LibNodePack CI job) and pushes the meta package and the six
      # per-RID packages to ms/react-native-public, plus the symbols of the
      # signed win-x64 and win-arm64 libnode.dll (the per-RID CI build
      # artifacts) to the Symbol Server.
      # =====================================================================
      - job: ms_react_native_nuget_job_libnode
        displayName: Publish Nuget (Microsoft.JavaScript.LibNode) to ms/react-native-public
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: libnode-packages
            targetPath: $(Pipeline.Workspace)\libnode-packages

        steps:
        - template: .ado/templates/publish-nuget-to-ado-feed.yml@self
          parameters:
            endpointId: '29e4c04c-ae69-4453-b9f3-bfef7a4c8d32'
            nugetFeedUrl: 'https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/nuget/v3/index.json'
            packageParentPath: '$(Pipeline.Workspace)/libnode-packages'
            packagesToPush: '$(Pipeline.Workspace)/libnode-packages/Microsoft.JavaScript.LibNode.*.nupkg'
            publishFeedCredentials: 'Nuget - ms/react-native-public'
            feedDisplayName: 'ms/react-native-public'

      - job: publish_symbols_job_libnode
        displayName: Publish PDB Symbols (Microsoft.JavaScript.LibNode) to Symbol Server
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: libnode-win-x64
            targetPath: $(Pipeline.Workspace)\libnode-symbols\libnode-win-x64
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: libnode-win-arm64
            targetPath: $(Pipeline.Workspace)\libnode-symbols\libnode-win-arm64

        steps:
        - template: .ado/templates/publish-symbols.yml@self
          parameters:
            symbolsArtifactName: LibNode-Symbols-$(Build.BuildId)
            symbolsFolder: $(Pipeline.Workspace)/libnode-symbols

      # The seven signed LibNode packages to nuget.org through ESRP Release,
      # after they reach ms/react-native-public. Only a manual run with
      # publishLibNodeToNuGetOrg set has this job, and it runs only for a CI
      # run of main. ESRP publishes them without approval.
      - ${{ if eq(parameters.publishLibNodeToNuGetOrg, true) }}:
        - job: nuget_org_job_libnode
          displayName: Publish Nuget (Microsoft.JavaScript.LibNode) to nuget.org
          dependsOn: ms_react_native_nuget_job_libnode
          condition: >-
            and(succeeded(),
            eq(variables['Build.Reason'], 'Manual'),
            eq(variables['resources.pipeline.microsoft.v8-jsi.ci.sourceBranch'], 'refs/heads/main'))
          timeoutInMinutes: 120

          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            # Its own download: the ms/react-native-public job deletes the
            # packages already on that feed from its copy.
            - input: pipelineArtifact
              pipeline: microsoft.v8-jsi.ci
              artifactName: libnode-packages
              targetPath: $(Pipeline.Workspace)\libnode-packages-esrp

          steps:
          # ESRP uploads the whole folder; stage only the LibNode packages.
          - task: CopyFiles@2
            displayName: Stage LibNode packages for ESRP Release
            inputs:
              SourceFolder: '$(Pipeline.Workspace)\libnode-packages-esrp'
              Contents: 'Microsoft.JavaScript.LibNode.*.nupkg'
              TargetFolder: '$(Agent.TempDirectory)\esrp-nuget\react-native-windows'
              CleanTargetFolder: true

          # CopyFiles succeeds with no match, so check the folder holds exactly
          # the meta package and the six per-RID packages of one release version.
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $entries = @(Get-ChildItem -LiteralPath $env:SUBMISSION_DIR -Force)
              foreach ($entry in $entries) { Write-Host "  $($entry.Name) ($([math]::Round($entry.Length / 1MB, 1)) MB)" }
              $names = @($entries | ForEach-Object Name)
              $meta = @($names | Where-Object { $_ -match '^Microsoft\.JavaScript\.LibNode\.\d+\.\d+\.\d+\.nupkg$' })
              if ($meta.Count -ne 1) {
                throw "Expected one Microsoft.JavaScript.LibNode package with a release version (N.N.N), found $($meta.Count)."
              }
              $version = $meta[0] -replace '^Microsoft\.JavaScript\.LibNode\.(.+)\.nupkg$', '$1'
              $expected = @("Microsoft.JavaScript.LibNode.$version.nupkg") +
                @('win-x64', 'win-arm64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64' |
                  ForEach-Object { "Microsoft.JavaScript.LibNode.$_.$version.nupkg" })
              $missing = @($expected | Where-Object { $_ -notin $names })
              $unexpected = @($names | Where-Object { $_ -notin $expected })
              if ($missing.Count -gt 0 -or $unexpected.Count -gt 0) {
                throw "The ESRP submission must be the seven LibNode $version packages. Missing: $($missing -join ', '). Unexpected: $($unexpected -join ', ')."
              }
              Write-Host "Submitting the seven Microsoft.JavaScript.LibNode $version packages."
            displayName: Check the ESRP submission
            env:
              SUBMISSION_DIR: $(Agent.TempDirectory)\esrp-nuget\react-native-windows

          - task: EsrpRelease@14
            displayName: ESRP Release to nuget.org
            inputs:
              connectedservicename: 'ESRP-JSHost3'
              usemanagedidentity: false
              keyvaultname: 'OGX-JSHost-KV'
              authcertname: 'OGX-JSHost-Auth4'
              signcertname: 'OGX-JSHost-Sign3'
              clientid: '0a35e01f-eadf-420a-a2bf-def002ba898d'
              domaintenantid: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
              intent: 'PackageDistribution'
              contenttype: 'NuGet'
              organizationname: 'react-native-windows'
              contentsource: 'Folder'
              folderlocation: '$(Agent.TempDirectory)\esrp-nuget\react-native-windows'
              waitforreleasecompletion: true
              owners: 'vmorozov@microsoft.com'
              approvers: 'khosany@microsoft.com'
              serviceendpointurl: 'https://api.esrp.microsoft.com'
              mainpublisher: 'ESRPRELPACMAN'
