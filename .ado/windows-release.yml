#
# The v8-jsi Release pipeline entry point.
# It releases NuGet packages to the public ms/react-native ADO feed and to the Office feed,
# and the LibNode packages to nuget.org.
#
# It releases only CI runs of main. The CI resource trigger below starts it
# only for those, but a manual run can pick any CI run, including a test
# branch's prerelease (-g<sha>) packages, and nuget.org versions can't be
# replaced or deleted. So the Gate stage checks the CI run's branch first: for
# main it names the run after the version it releases and lets the Publish
# stage run; for any other branch the run succeeds as "Skipped - ..." and
# publishes nothing.
#

name: v8jsi_release_0.0.$(Date:yyMM.d)$(Rev:rrr)

# Runs when microsoft.v8-jsi.ci completes on main (see resources below);
# triggers are defined here, not in the ADO pipeline UI.
trigger: none
pr: none

resources:
  pipelines:
  - pipeline: microsoft.v8-jsi.ci
    project: ISS
    source: microsoft.v8-jsi.ci
    trigger:
      branches:
        include:
        - main

  repositories:
  - repository: CustomPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@CustomPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      vmImage: windows-latest
      os: windows

    stages:
    - stage: gate
      displayName: Evaluate release

      jobs:
      - job: evaluate
        displayName: Check that the CI run is from main
        steps:
        - checkout: none

        # The CI run name is "<CI build number> - <version>" (set by the
        # V8JsiComputeVersion CI job). An unresolved variable reads as another
        # branch, so the run is skipped rather than released.
        - pwsh: |
            $branch = $env:CI_SOURCE_BRANCH
            $ciRunName = $env:CI_RUN_NAME
            $stamp = $env:BUILD_BUILDNUMBER -replace '^v8jsi_release_0\.0\.', ''
            $version = if ($ciRunName -match ' - (.+)$') { $Matches[1] } else { $ciRunName }
            Write-Host "CI run:    $ciRunName"
            Write-Host "CI branch: $branch"
            if ($branch -eq 'refs/heads/main') {
              $shouldRelease = 'True'
              $buildNumber = "Release $version - $stamp"
              Write-Host "Releasing $version."
            } else {
              $shouldRelease = 'False'
              $buildNumber = "Skipped - $ciRunName ($($branch -replace '^refs/heads/', '')) - $stamp"
              Write-Host "Skipping: only CI runs of main are released; this one is from '$branch'. Nothing is published."
            }
            # Build numbers can't contain " / : < > \ | ? @ * or end with '.'.
            $buildNumber = ($buildNumber -replace '["/:<>\\|?@*]', '_').TrimEnd('.')
            Write-Host "##vso[build.updatebuildnumber]$buildNumber"
            Write-Host "##vso[task.setvariable variable=shouldRelease;isOutput=true]$shouldRelease"
          name: gate
          displayName: Decide whether to release
          env:
            CI_SOURCE_BRANCH: $(resources.pipeline.microsoft.v8-jsi.ci.sourceBranch)
            CI_RUN_NAME: $(resources.pipeline.microsoft.v8-jsi.ci.runName)
            BUILD_BUILDNUMBER: $(Build.BuildNumber)

        - pwsh: Write-Host 'Releasing'
          displayName: RELEASING - the CI run is from main
          condition: eq(variables['gate.shouldRelease'], 'True')

        - pwsh: Write-Host 'Skipping'
          displayName: SKIPPED - the CI run is not from main, nothing is published
          condition: eq(variables['gate.shouldRelease'], 'False')

    - stage: publish_nugets
      displayName: Publish V8Jsi NuGets
      dependsOn: gate
      condition: and(succeeded(), eq(dependencies.gate.outputs['evaluate.gate.shouldRelease'], 'True'))

      jobs:
      # =====================================================================
      # Node.js-source package: Microsoft.JavaScript.V8. Consumes the
      # published-packages-new artifact (produced by the V8JsiCreateNugetNew CI
      # aggregator) and pushes Microsoft.JavaScript.V8.* to the
      # ms/react-native-public and office feeds, plus its symbols to the Symbol
      # Server.
      # =====================================================================
      - job: ms_react_native_nuget_job_new
        displayName: Publish Nuget (Microsoft.JavaScript.V8) to ms/react-native-public
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: published-packages-new
            targetPath: $(Pipeline.Workspace)\published-packages-new

        steps:
        - template: .ado/templates/publish-nuget-to-ado-feed.yml@self
          parameters:
            endpointId: '29e4c04c-ae69-4453-b9f3-bfef7a4c8d32'
            nugetFeedUrl: 'https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/nuget/v3/index.json'
            packageParentPath: '$(Pipeline.Workspace)/published-packages-new'
            packagesToPush: '$(Pipeline.Workspace)/published-packages-new/Microsoft.JavaScript.V8.*.nupkg'
            publishFeedCredentials: 'Nuget - ms/react-native-public'
            feedDisplayName: 'ms/react-native-public'

      - job: office_nuget_job_new
        displayName: Publish Nuget (Microsoft.JavaScript.V8) to office
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: published-packages-new
            targetPath: $(Pipeline.Workspace)\published-packages-new

        steps:
        - template: .ado/templates/publish-nuget-to-office-feed.yml@self
          parameters:
            packageParentPath: $(Pipeline.Workspace)\published-packages-new
            packagesToPush: $(Pipeline.Workspace)/published-packages-new/Microsoft.JavaScript.V8.*.nupkg

      - job: publish_symbols_job_new
        displayName: Publish PDB Symbols (Microsoft.JavaScript.V8) to Symbol Server
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          # Consume the per-arch build artifacts directly — the signed v8jsi2.dll +
          # PDB from each Release cell, and the signed sandbox binaries + PDBs —
          # the same bits the NuGet aggregator packs. Build once, sign once, reuse;
          # no dependence on a build.ts-staged symbols/ dir. Each artifact lands in
          # its own subfolder under a shared symbols/ root.
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_x64_Release-new
            targetPath: $(Pipeline.Workspace)\symbols\Desktop_x64_Release-new
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_x86_Release-new
            targetPath: $(Pipeline.Workspace)\symbols\Desktop_x86_Release-new
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_ARM64_Release-new
            targetPath: $(Pipeline.Workspace)\symbols\Desktop_ARM64_Release-new
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: sandbox-binaries-win-x64
            targetPath: $(Pipeline.Workspace)\symbols\sandbox-binaries-win-x64
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: sandbox-binaries-win-x86
            targetPath: $(Pipeline.Workspace)\symbols\sandbox-binaries-win-x86
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: sandbox-binaries-win-arm64
            targetPath: $(Pipeline.Workspace)\symbols\sandbox-binaries-win-arm64

        steps:
        - pwsh: |
            $symbolsDir = "$(Pipeline.Workspace)/symbols"
            $pdbs = Get-ChildItem $symbolsDir -Recurse -Filter "*.pdb"
            Write-Host "Found $($pdbs.Count) PDB file(s) under $symbolsDir`:"
            foreach ($pdb in $pdbs) {
              Write-Host "  $($pdb.FullName) ($([math]::Round($pdb.Length / 1MB, 2)) MB)"
            }
            if ($pdbs.Count -eq 0) {
              Write-Host "##vso[task.logissue type=warning]No PDB files found in downloaded artifacts"
            }
          displayName: Inspect downloaded symbols

        - template: .ado/templates/publish-symbols.yml@self
          parameters:
            symbolsArtifactName: V8Jsi-Symbols-New-$(Build.BuildId)

      - job: ms_react_native_nuget_job_legacy
        displayName: Publish Nuget (ReactNative.V8Jsi.Windows) to ms/react-native-public
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: published-packages-legacy
            targetPath: $(Pipeline.Workspace)\published-packages-legacy

        steps:
        - template: .ado/templates/publish-nuget-to-ado-feed.yml@self
          parameters:
            endpointId: '29e4c04c-ae69-4453-b9f3-bfef7a4c8d32'
            nugetFeedUrl: 'https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/nuget/v3/index.json'
            packageParentPath: '$(Pipeline.Workspace)/published-packages-legacy'
            packagesToPush: '$(Pipeline.Workspace)/published-packages-legacy/ReactNative.V8Jsi.Windows.*.nupkg'
            publishFeedCredentials: 'Nuget - ms/react-native-public'
            feedDisplayName: 'ms/react-native-public'

      - job: office_nuget_job_legacy
        displayName: Publish Nuget (ReactNative.V8Jsi.Windows) to office
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: published-packages-legacy
            targetPath: $(Pipeline.Workspace)\published-packages-legacy

        steps:
        - template: .ado/templates/publish-nuget-to-office-feed.yml@self
          parameters:
            packageParentPath: $(Pipeline.Workspace)\published-packages-legacy
            packagesToPush: $(Pipeline.Workspace)/published-packages-legacy/ReactNative.V8Jsi.Windows.*.nupkg

      - job: publish_symbols_job_legacy
        displayName: Publish full PDB Symbols (ReactNative.V8Jsi.Windows) to Symbol Server
        condition: succeeded()
        timeoutInMinutes: 120

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_x64_Debug-legacy
            targetPath: $(Pipeline.Workspace)\legacy-symbol-inputs\Desktop_x64_Debug-legacy
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_x86_Debug-legacy
            targetPath: $(Pipeline.Workspace)\legacy-symbol-inputs\Desktop_x86_Debug-legacy
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_ARM64_Debug-legacy
            targetPath: $(Pipeline.Workspace)\legacy-symbol-inputs\Desktop_ARM64_Debug-legacy
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_x64_Release-legacy
            targetPath: $(Pipeline.Workspace)\legacy-symbol-inputs\Desktop_x64_Release-legacy
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_x86_Release-legacy
            targetPath: $(Pipeline.Workspace)\legacy-symbol-inputs\Desktop_x86_Release-legacy
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: Desktop_ARM64_Release-legacy
            targetPath: $(Pipeline.Workspace)\legacy-symbol-inputs\Desktop_ARM64_Release-legacy

        steps:
        # Release agents cannot enlist sources. Validate the signed package images
        # against their full PDBs here, then publish only the verified pairs.
        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $dumpbin = & $vswhere -latest -prerelease -products * -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
            $pdbutil = & $vswhere -latest -prerelease -products * -find 'VC/Tools/Llvm/x64/bin/llvm-pdbutil.exe' | Select-Object -First 1
            if (-not $dumpbin -or -not $pdbutil) { throw 'Visual Studio dumpbin and llvm-pdbutil are required' }

            function Assert-LegacySymbolPair($dll, $pdb, $packageDll) {
              Get-Item -LiteralPath $dll, $pdb, $packageDll | Out-Null
              if ((Get-AuthenticodeSignature $dll).Status -ne 'Valid') { throw "Invalid signature: $dll" }
              if ((Get-FileHash $dll).Hash -ne (Get-FileHash $packageDll).Hash) { throw "Symbol image differs from package: $dll" }
              $headers = (& $dumpbin /headers $dll) -join "`n"
              if ($LASTEXITCODE -ne 0) { throw "Cannot read DLL: $dll" }
              $summary = (& $pdbutil dump --summary $pdb) -join "`n"
              if ($LASTEXITCODE -ne 0) { throw "Cannot read PDB: $pdb" }
              $rsds = [regex]::Match($headers, 'Format:\s*RSDS,\s*\{([^}]+)\},\s*(\d+)', 'IgnoreCase')
              $guid = [regex]::Match($summary, 'GUID:\s*\{([^}]+)\}', 'IgnoreCase')
              $age = [regex]::Match($summary, 'Age:\s*(\d+)', 'IgnoreCase')
              if (-not $rsds.Success -or -not $guid.Success -or -not $age.Success -or
                  $rsds.Groups[1].Value -ne $guid.Groups[1].Value -or $rsds.Groups[2].Value -ne $age.Groups[1].Value) {
                throw "DLL/PDB identity mismatch: $dll"
              }
              foreach ($field in 'Has Debug Info: true', 'Has Types: true', 'Is stripped: false') {
                if ($summary -notmatch [regex]::Escape($field)) { throw "Full PDB required: $pdb ($field)" }
              }
              Write-Host "Verified $dll with $pdb ($((Get-Item $pdb).Length) bytes)"
            }

            $inputsDir = "$(Pipeline.Workspace)/legacy-symbol-inputs"
            $symbolsDir = "$(Pipeline.Workspace)/legacy-symbols"
            foreach ($configuration in 'Debug', 'Release') {
              foreach ($platform in 'x64', 'x86', 'ARM64') {
                $artifact = "$inputsDir/Desktop_$($platform)_$configuration-legacy"
                $source = "$artifact/symbols/$($platform.ToLower())-$configuration"
                $dll = "$source/v8jsi.dll"
                $pdb = "$source/v8jsi.dll.pdb"
                $packageDll = "$artifact/pkg-staging/lib/win32/$configuration/$($platform.ToLower())/v8jsi.dll"
                Assert-LegacySymbolPair $dll $pdb $packageDll
                $destination = "$symbolsDir/$($platform.ToLower())-$configuration"
                New-Item -ItemType Directory -Force $destination | Out-Null
                Copy-Item -LiteralPath $dll, $pdb -Destination $destination
              }
            }
          displayName: Verify six signed DLL and full PDB pairs

        - template: .ado/templates/publish-symbols.yml@self
          parameters:
            symbolsArtifactName: V8Jsi-Symbols-Legacy-$(Build.BuildId)
            symbolsFolder: $(Pipeline.Workspace)/legacy-symbols

      # =====================================================================
      # Microsoft.JavaScript.LibNode. Consumes the libnode-packages artifact
      # (the LibNodePack CI job) and pushes the meta package and the six
      # per-RID packages to ms/react-native-public, plus the symbols of the
      # signed win-x64 and win-arm64 libnode.dll (the per-RID CI build
      # artifacts) to the Symbol Server.
      # =====================================================================
      - job: ms_react_native_nuget_job_libnode
        displayName: Publish Nuget (Microsoft.JavaScript.LibNode) to ms/react-native-public
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: libnode-packages
            targetPath: $(Pipeline.Workspace)\libnode-packages

        steps:
        - template: .ado/templates/publish-nuget-to-ado-feed.yml@self
          parameters:
            endpointId: '29e4c04c-ae69-4453-b9f3-bfef7a4c8d32'
            nugetFeedUrl: 'https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/nuget/v3/index.json'
            packageParentPath: '$(Pipeline.Workspace)/libnode-packages'
            packagesToPush: '$(Pipeline.Workspace)/libnode-packages/Microsoft.JavaScript.LibNode.*.nupkg'
            publishFeedCredentials: 'Nuget - ms/react-native-public'
            feedDisplayName: 'ms/react-native-public'

      - job: publish_symbols_job_libnode
        displayName: Publish PDB Symbols (Microsoft.JavaScript.LibNode) to Symbol Server
        condition: succeeded()
        timeoutInMinutes: 30

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: libnode-win-x64
            targetPath: $(Pipeline.Workspace)\libnode-symbols\libnode-win-x64
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: libnode-win-arm64
            targetPath: $(Pipeline.Workspace)\libnode-symbols\libnode-win-arm64

        steps:
        - template: .ado/templates/publish-symbols.yml@self
          parameters:
            symbolsArtifactName: LibNode-Symbols-$(Build.BuildId)
            symbolsFolder: $(Pipeline.Workspace)/libnode-symbols

      - job: nuget_org_job_libnode
        displayName: Publish Nuget (Microsoft.JavaScript.LibNode) to nuget.org

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: microsoft.v8-jsi.ci
            artifactName: libnode-packages
            targetPath: '$(Pipeline.Workspace)\libnode-packages'

        steps:
        - pwsh: |
            Get-ChildItem -LiteralPath '$(Pipeline.Workspace)\libnode-packages' -Recurse
          displayName: Show directory contents

        # ESRP uploads the whole folder; stage only the NuGet packages.
        - task: CopyFiles@2
          displayName: Stage NuGet packages for ESRP Release
          inputs:
            SourceFolder: '$(Pipeline.Workspace)\libnode-packages'
            Contents: 'Microsoft.JavaScript.LibNode.*.nupkg'
            TargetFolder: '$(Agent.TempDirectory)\esrp-nuget\react-native-windows'

        - pwsh: |
            Get-ChildItem -LiteralPath '$(Agent.TempDirectory)\esrp-nuget\react-native-windows' -Recurse
          displayName: Show ESRP submission directory contents

        - task: EsrpRelease@14
          displayName: ESRP Release to NuGet.org
          inputs:
            connectedservicename: 'ESRP-JSHost3'
            usemanagedidentity: false
            keyvaultname: 'OGX-JSHost-KV'
            authcertname: 'OGX-JSHost-Auth4'
            signcertname: 'OGX-JSHost-Sign3'
            clientid: '0a35e01f-eadf-420a-a2bf-def002ba898d'
            domaintenantid: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
            intent: 'PackageDistribution'
            contenttype: 'NuGet'
            organizationname: 'react-native-windows'
            contentsource: 'Folder'
            folderlocation: '$(Agent.TempDirectory)\esrp-nuget\react-native-windows'
            waitforreleasecompletion: true
            owners: 'vmorozov@microsoft.com'
            approvers: 'khosany@microsoft.com'
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            mainpublisher: 'ESRPRELPACMAN'
