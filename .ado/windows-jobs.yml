parameters:
    # isPublish is `true` for CI builds and `false` for PR validation.
  - name: isPublish
    type: boolean
    default: false
    # To fake building v8-jsi for faster debugging.
  - name: fakeBuild
    type: boolean
    default: false
    # Matrix with target platforms for v8-jsi binaries.
  - name: BuildMatrix
    type: object
    default:
      - Name: Desktop_x64_Debug
        BuildConfiguration: Debug
        BuildPlatform: x64
        AppPlatform: win32
      - Name: Desktop_x86_Debug
        BuildConfiguration: Debug
        BuildPlatform: x86
        AppPlatform: win32
      - Name: Desktop_ARM64_Debug
        BuildConfiguration: Debug
        BuildPlatform: arm64
        AppPlatform: win32
      - Name: Desktop_x64_Release
        BuildConfiguration: Release
        BuildPlatform: x64
        AppPlatform: win32
      - Name: Desktop_x86_Release
        BuildConfiguration: Release
        BuildPlatform: x86
        AppPlatform: win32
      - Name: Desktop_ARM64_Release
        BuildConfiguration: Release
        BuildPlatform: arm64
        AppPlatform: win32
    # Matrix with target platforms for the sandbox binaries. A separate list
    # from BuildMatrix because the sandbox cells carry extra per-arch knobs: the
    # gn out dir (sbox.dll/v8host.exe land in out/sandbox-<cpu>) and whether the
    # lockdown tier runs in this job (RunTier).
    # RunTier is true for every arch: x64/x86 run on the x64 agent (x86 via
    # WOW64) and arm64 runs natively on the ARM64 managed-image pool, so each
    # cell executes its own Untrusted lockdown tier.
  - name: SandboxMatrix
    type: object
    default:
      - Name: x64
        BuildPlatform: x64
        Rid: win-x64
        SboxOutDir: deps/chromium/out/sandbox-x64
        RunTier: true
      - Name: x86
        BuildPlatform: x86
        Rid: win-x86
        SboxOutDir: deps/chromium/out/sandbox-x86
        RunTier: true
      - Name: arm64
        BuildPlatform: arm64
        Rid: win-arm64
        SboxOutDir: deps/chromium/out/sandbox-arm64
        RunTier: true

resources:
  repositories:
    # The repo for the Office compliant build pipeline templates.
  - repository: OfficePipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  # Extend the Office compliant build pipeline template.
  ${{ if eq(parameters.isPublish, true) }}:
    template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  ${{ else }}:
    template: v1/Office.Unofficial.PipelineTemplate.yml@OfficePipelineTemplates

  parameters:
    # 1ES auto-injects PREfast (/analyze) into every MSBuild C++ compile, but the
    # Node.js >= 24 build uses clang-cl, which rejects /analyze and fails. Only
    # this flag gates the injection (sdl.prefast.enabled does not). CodeQL still
    # covers compiled static analysis.
    featureFlags:
      autoEnablePREfastWithNewRuleset: false
    settings:
      ${{ if eq(parameters.isPublish, false) }}:
        skipBuildTagsForGitHubPullRequests: true
    pool:
      name: fabric-internal-pool-large
      demands: ImageOverride -equals windows-2025-1espt
    sdl:
      # Also disable the PREfast scan itself -- clang-cl can't run /analyze. (The
      # injection above is the actual build-breaker; this is belt-and-suspenders.)
      prefast:
        enabled: false
        justificationForDisabling: "Build uses clang-cl (required by Node.js >= 24); MSVC PREfast /analyze is incompatible. Compiled static analysis is covered by CodeQL."
      bandit:
        # Chromium's vendored build/test Python uses exec() for Python-formatted
        # metadata and MD5/SHA1 for non-security cache keys and test data. Keep
        # Bandit enabled for first-party and Node/V8 Python.
        excludedPaths: |
          .gdn
          deps\chromium
      binskim:
        analyzeTarget: |
          $(Build.StagingDirectory)\out\pkg-staging\**\*.dll
          $(Build.StagingDirectory)\out\pkg-staging\**\*.exe
      eslint:
        enableExclusions: true
        # This repo does not ship any JavaScript code. But it has many test cases for
        # the Hermes JS engine that fail parsing, have code considered insecure and crash eslint.
        exclusionPatterns: |
          '**/*.*'
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\.ado\guardian\SDL\.gdnsuppress
      codeql:
        compiled:
          enabled: true
        runSourceLanguagesInSourceAnalysis: true

    stages:
    - stage: main
      jobs:
      # =====================================================================
      # Compute versions. Runs first and is the ONLY job that needs the full
      # git history: scripts/compute-version.ts derives each package's patch
      # from git height (commits since its versions/*.version file last
      # changed). It writes the computed versions into config.json and this job
      # publishes that config.json as the `version-config` artifact. Every
      # build/pack/tag job depends on this job and overlays the artifact (see
      # .ado/overlay-version-config.yml), so they read the computed version with
      # a shallow checkout and no code change. The write stays in the working
      # tree / artifact only -- it is never committed (committing would move the
      # height anchor). Also sets the pipeline run number to the
      # Microsoft.JavaScript.V8 version so each run is identifiable.
      # =====================================================================
      - job: V8JsiComputeVersion
        displayName: Compute versions
        templateContext:
          outputs:
          - output: pipelineArtifact
            artifactName: version-config
            targetPath: $(Build.StagingDirectory)\version-config
        steps:
          # Height is a commit count, so this job (and only this job) needs the
          # complete first-parent history.
        - checkout: self
          fetchDepth: 0

        - task: UseNode@1
          displayName: Use Node.js 24.x
          inputs:
            version: '24.x'

          # Materialize both computed versions into config.json (surgical field
          # replace; formatting preserved) and stage it for publishing.
        - pwsh: |
            node scripts/compute-version.ts --write
            $stage = "$(Build.StagingDirectory)\version-config"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item -Force config.json (Join-Path $stage 'config.json')
            Write-Host "Staged computed config.json:"
            Get-Content config.json
          displayName: Compute versions into config.json
          workingDirectory: $(Build.SourcesDirectory)

          # Keep the ADO run-id prefix (pipeline `name:`), then append the
          # computed version -> "<run-id> - <v8jsi>".
        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $info = node scripts/compute-version.ts --json | ConvertFrom-Json
            $v8jsi = ($info.packages | Where-Object { $_.packageId -eq 'Microsoft.JavaScript.V8' }).version
            if ([string]::IsNullOrWhiteSpace($v8jsi)) { throw 'Could not resolve the Microsoft.JavaScript.V8 version' }
            $runNumber = "$($env:BUILD_BUILDNUMBER) - $v8jsi"
            Write-Host "##vso[build.updatebuildnumber]$runNumber"
            Write-Host "Pipeline run number set to $runNumber"
          displayName: Set pipeline run number
          workingDirectory: $(Build.SourcesDirectory)


      - ${{ each matrix in parameters.BuildMatrix }}:
        - job: V8JsiBuildNew_${{ matrix.Name }}
          displayName: Build V8-JSI (Node.js source) ${{ matrix.Name }}

          # Wait for the computed config.json (overlaid in windows-build-new.yml).
          dependsOn: V8JsiComputeVersion

          timeoutInMinutes: 1200

          # ARM64 cells build natively on the ARM64 managed-image pool so their
          # tests actually execute -- on an x64 agent build.ts can only cross-
          # compile arm64 and skips the tests. windows-2025-1espt-arm64 is a
          # single-image pool, so it takes no ImageOverride demand. x64/x86 cells
          # inherit the top-level fabric-internal-pool-large pool, which pins the
          # windows-2025-1espt image.
          ${{ if eq(matrix.BuildPlatform, 'arm64') }}:
            pool:
              name: windows-2025-1espt-arm64

          variables:
          - name: Packaging.EnableSBOMSigning
            value: ${{ startsWith(variables['System.CollectionUri'], 'https://dev.azure.com/microsoft') }}

          templateContext:
            outputs:
              # Only Release cells stage a NuGet artifact: build.ts --pack lays
              # out-new/pkg-staging for the V8JsiCreateNugetNew aggregator. Debug
              # cells just build + run gtests (no NuGet ships from Debug), so the
              # outputs list is empty for them. Publishing only pkg-staging (not
              # the whole out-new) keeps the per-cell artifact to the binaries +
              # headers the aggregator needs — it omits the unused per-cell .nupkg.
            - ${{ if eq(matrix.BuildConfiguration, 'Release') }}:
              - output: pipelineArtifact
                artifactName: ${{ matrix.Name }}-new
                targetPath: $(Build.StagingDirectory)\out-new\pkg-staging

          steps:
            # ARM64 agents ship no externals\node10, but the mandatory 1ES build-
            # retention post-job still runs on the Node 10 handler; shim node10 to
            # the image's Node so that post-job doesn't fail. Right after checkout.
          - ${{ if eq(matrix.BuildPlatform, 'arm64') }}:
            - template: /.ado/ensure-node10-shim.yml@self

          - task: UseNode@1
            displayName: Use Node.js 24.x
            inputs:
              version: '24.x'

            # The Release cells pack (build.ts --pack) and smoke (run-smoke.ps1)
            # both need nuget.exe on PATH.
          - task: NuGetToolInstaller@1
            displayName: Install NuGet tools
            inputs:
              versionSpec: ">=4.6.0"

          - template: /.ado/windows-build-new.yml@self
            parameters:
              outputPath: $(Build.StagingDirectory)\out-new
              appPlatform: ${{ matrix.AppPlatform }}
              buildConfiguration: ${{ matrix.BuildConfiguration }}
              buildPlatform: ${{ matrix.BuildPlatform }}
              isPublish: ${{ parameters.isPublish }}
              fakeBuild: ${{ parameters.fakeBuild }}

            # Sign v8jsi.dll before the per-RID artifact is published, so the
            # aggregated NuGet and the symbol-server image are both signed (the
            # legacy and sandbox jobs already sign their binaries; this closes the
            # gap for the Node.js-source build). Release-only: only Release cells
            # stage out-new/pkg-staging (Debug cells build + test but don't pack).
          - ${{ if and(eq(parameters.isPublish, true), eq(parameters.fakeBuild, false), eq(matrix.BuildConfiguration, 'Release')) }}:
            - template: /.ado/templates/esrp-codesign-binaries.yml@self
              parameters:
                folderPath: $(Build.StagingDirectory)\out-new\pkg-staging
                pattern: |
                  **\v8jsi.dll

        # =====================================================================
        # Sandbox binaries. One job PER RID (x64/x86/arm64) builds that arch's
        # sandbox payload and publishes it (under a build/native/<rid>/ layout)
        # as the `sandbox-binaries-<rid>` artifact, which the V8JsiCreateNugetNew
        # aggregator merges into the Microsoft.JavaScript.V8.<rid> package. The
        # sandbox is kept a separate job + artifact (not folded into the MSVC
        # matrix cells) to isolate the gn/clang toolchain it needs. Each cell runs
        # on its own fresh agent, so the cross-arch out-dir clobber (vcbuild
        # always writes deps/nodejs/out/Release regardless of arch) and the
        # lite-flag stale-snapshot gotcha (toggling the sandbox-engine flags needs
        # a clean engine out dir) do not apply. Each builds TWO toolchains:
        #   * v8jsisb.dll      -- the jitless sandbox engine (MSVC/vcbuild, via
        #                         scripts/build.ts --build-v8jsisb). x64/arm64
        #                         carry the V8 cage; x86 is the degraded no-cage
        #                         variant (the cage is 64-bit-only).
        #   * sbox.dll/v8host.exe -- the Chromium sandbox (gn + VS clang/ninja, via
        #                         scripts/sbox-build.ts --target-cpu). x64/x86
        #                         build on the x64 agent; arm64 builds natively on
        #                         the ARM64 pool. test_app.exe is the TEST harness
        #                         and is NOT shipped/signed.
        # Hygiene gates (export allowlist + Hybrid CRT + BinSkim) run via --check.
        # The Untrusted lockdown tier runs as a CI test for every arch: x64 + x86
        # on the x64 agent (x86 via WOW64) and arm64 natively on the ARM64 pool
        # (RunTier: true). The three shipped binaries are signed on the publishing
        # build.
        # =====================================================================
      - ${{ each sb in parameters.SandboxMatrix }}:
        - job: V8JsiBuildSandbox_${{ sb.Name }}
          displayName: Build Sandbox (${{ sb.Rid }})

          # Wait for the computed config.json (overlaid below before building).
          dependsOn: V8JsiComputeVersion

          timeoutInMinutes: 180

          # ARM64 builds natively on the ARM64 managed-image pool so its Untrusted
          # lockdown tier can execute (AA64 binaries can't run on an x64 agent).
          # It's a single-image pool, so no ImageOverride demand. x64/x86 keep the
          # existing image, unchanged.
          ${{ if eq(sb.BuildPlatform, 'arm64') }}:
            pool:
              name: windows-2025-1espt-arm64
          ${{ else }}:
            pool:
              name: fabric-internal-pool-large
              demands: ImageOverride -equals windows-2025-1espt

          variables:
          - name: Packaging.EnableSBOMSigning
            value: ${{ startsWith(variables['System.CollectionUri'], 'https://dev.azure.com/microsoft') }}

          templateContext:
            outputs:
            - output: pipelineArtifact
              artifactName: sandbox-binaries-${{ sb.Rid }}
              targetPath: $(Build.StagingDirectory)\sandbox

          steps:
            # The vendored gn (deps/gn/gn.exe) is a Git LFS object; the default
            # checkout skips LFS smudging, so fetch it explicitly or sbox-build.ts
            # can't find gn.
          - checkout: self
            lfs: true

            # ARM64 agents ship no externals\node10, but the mandatory 1ES build-
            # retention post-job still runs on the Node 10 handler; shim node10 to
            # the image's Node so that post-job doesn't fail.
          - ${{ if eq(sb.BuildPlatform, 'arm64') }}:
            - template: /.ado/ensure-node10-shim.yml@self

            # Overlay the CI-computed config.json before building. Both the
            # jitless engine (build.ts --build-v8jsisb -> gyp
            # generate_version_info.ts) and the Chromium sandbox binaries
            # (sbox-build.ts -> gn rc) stamp their version from
            # config.json.v8jsi_version.
          - template: /.ado/overlay-version-config.yml@self

          - task: UseNode@1
            displayName: Use Node.js 24.x
            inputs:
              version: '24.x'

          - ${{ if eq(parameters.fakeBuild, false) }}:
              # BinSkim (run by --check) installs from the react-native-public ADO
              # feed; authenticate the NuGet client for that restore.
            - task: NuGetToolInstaller@1
              displayName: Install NuGet tools
              inputs:
                versionSpec: ">=4.6.0"

            - task: NuGetAuthenticate@1
              displayName: Authenticate NuGet (BinSkim feed)

              # gn gen + ninja generic with the VS clang/ninja toolchain. The
              # script resolves the toolchain via vswhere, creates the space-free
              # clang junction, writes args.gn, and builds into the per-arch out
              # dir (out/sandbox-<cpu>).
            - pwsh: |
                node scripts/sbox-build.ts --target-cpu ${{ sb.BuildPlatform }}
              displayName: Build sbox.dll + v8host.exe (gn/ninja, VS clang)
              workingDirectory: $(Build.SourcesDirectory)

              # The jitless sandbox engine (MSVC/vcbuild). Fresh agent => clean
              # engine out, so the lite-flag stale-snapshot gotcha doesn't apply.
            - pwsh: |
                node scripts/build.ts --platform ${{ sb.BuildPlatform }} --configuration release `
                    --build-v8jsisb --no-test
              displayName: Build v8jsisb.dll (jitless sandbox engine, MSVC)
              workingDirectory: $(Build.SourcesDirectory)

              # The sandbox GYP build keeps the v8jsi target name but changes
              # its product name, so v8jsi_test.exe and the Node-API suite's
              # node_lite.exe child import v8jsisb.dll. Run both suites on every
              # architecture (ARM64 natively, x86 via WOW64). Both suites pass
              # unfiltered under jitless, so no JIT-specific exclusions apply.
            - pwsh: |
                node scripts/build.ts --no-build --test --build-v8jsisb `
                    --platform ${{ sb.BuildPlatform }} --configuration release
              displayName: Run JSI + Node-API gtests against v8jsisb.dll
              workingDirectory: $(Build.SourcesDirectory)

              # Hygiene gates: export allowlist + Hybrid CRT + BinSkim, over this
              # arch's out dir (--target-cpu resolves it). Exits non-zero on any
              # unaccepted finding.
            - pwsh: |
                node scripts/sbox-build.ts --no-gen --no-build --check `
                    --target-cpu ${{ sb.BuildPlatform }} `
                    --output-path $(Build.StagingDirectory)\out
              displayName: Sandbox hygiene gates (exports + Hybrid CRT + BinSkim)
              workingDirectory: $(Build.SourcesDirectory)

              # Lockdown tier test (product-default Untrusted = jitless + ACG):
              # stage the engine next to v8host (it LoadLibrary's v8jsisb.dll by
              # name) and run the test_app broker harness. RESULT: PASS +
              # target exit=0 is the success signal. Runs for every arch: x64 + x86
              # on the x64 agent (x86 via WOW64) and arm64 natively on the ARM64
              # pool.
            - ${{ if eq(sb.RunTier, true) }}:
              - pwsh: |
                  $sandboxOut = "$(Build.SourcesDirectory)\${{ sb.SboxOutDir }}"
                  Copy-Item "$(Build.SourcesDirectory)\deps\nodejs\out\Release\v8jsisb.dll" $sandboxOut -Force
                  $env:DEPOT_TOOLS_WIN_TOOLCHAIN = '0'
                  $env:SBOX_ALLOW_UNSIGNED = '1'
                  & "$sandboxOut\test_app.exe"
                  if ($LASTEXITCODE -ne 0) { Write-Error "Untrusted tier FAILED (exit $LASTEXITCODE)" }
                displayName: Lockdown tier test (Untrusted)
                workingDirectory: $(Build.SourcesDirectory)

            # Stage the shipped sandbox binaries under a build/native/<rid>/
            # layout so the aggregator can merge the downloaded artifact straight
            # into pkg-staging. v8jsisb.pdb is renamed to v8jsisb.dll.pdb (the
            # nuspec/symbol globs expect <dll>.pdb). test_app.exe (test harness)
            # is deliberately excluded. Always runs so the artifact path exists.
          - pwsh: |
              $sandboxOut = "$(Build.SourcesDirectory)\${{ sb.SboxOutDir }}"
              $eng = "$(Build.SourcesDirectory)\deps\nodejs\out\Release"
              $dst = "$(Build.StagingDirectory)\sandbox\build\native\${{ sb.Rid }}"
              New-Item -ItemType Directory -Force -Path $dst | Out-Null
              foreach ($f in 'sbox.dll','sbox.dll.lib','sbox.dll.pdb','v8host.exe','v8host.exe.pdb') {
                $p = Join-Path $sandboxOut $f
                if (Test-Path $p) { Copy-Item $p $dst }
              }
              if (Test-Path "$eng\v8jsisb.dll") { Copy-Item "$eng\v8jsisb.dll" $dst }
              if (Test-Path "$eng\v8jsisb.dll.pdb") { Copy-Item "$eng\v8jsisb.dll.pdb" $dst }
              elseif (Test-Path "$eng\v8jsisb.pdb") { Copy-Item "$eng\v8jsisb.pdb" (Join-Path $dst 'v8jsisb.dll.pdb') }
              # mkv8snapshot.exe: the offline snapshot builder (vcbuild output,
              # same dir as the engine — it links no V8). Ships per-RID beside
              # the engine it LoadLibrary's. PDB renamed to <exe>.pdb for the glob.
              if (Test-Path "$eng\mkv8snapshot.exe") { Copy-Item "$eng\mkv8snapshot.exe" $dst }
              if (Test-Path "$eng\mkv8snapshot.exe.pdb") { Copy-Item "$eng\mkv8snapshot.exe.pdb" $dst }
              elseif (Test-Path "$eng\mkv8snapshot.pdb") { Copy-Item "$eng\mkv8snapshot.pdb" (Join-Path $dst 'mkv8snapshot.exe.pdb') }
            displayName: Stage sandbox binaries (build/native/${{ sb.Rid }})
            workingDirectory: $(Build.SourcesDirectory)

              # Sign the SHIPPED sandbox binaries (v8jsisb.dll, sbox.dll,
              # v8host.exe, mkv8snapshot.exe) only on the publishing CI build.
              # test_app.exe is never staged, so it is never signed.
          - ${{ if and(eq(parameters.isPublish, true), eq(parameters.fakeBuild, false)) }}:
            - template: /.ado/templates/esrp-codesign-binaries.yml@self
              parameters:
                displayName: CodeSign Sandbox Binaries
                folderPath: $(Build.StagingDirectory)\sandbox
                pattern: |
                  **\v8jsisb.dll
                  **\sbox.dll
                  **\v8host.exe
                  **\mkv8snapshot.exe

              # Signed lockdown tier (publishing build only): re-run the
              # Untrusted broker harness against the ESRP-signed binaries with
              # NO SBOX_ALLOW_UNSIGNED override, so test_app.exe's WinVerifyTrust
              # gate enforces genuine Authenticode on the exact sbox.dll /
              # v8host.exe / v8jsisb.dll bytes that ship. Runs in ADDITION to the
              # unsigned tier above and depends on the signing step, hence the
              # isPublish gate. test_app.exe is the broker (never signature-
              # checked), so overlaying the three signed images suffices.
          - ${{ if and(eq(sb.RunTier, true), eq(parameters.isPublish, true), eq(parameters.fakeBuild, false)) }}:
            - pwsh: |
                $sandboxOut = "$(Build.SourcesDirectory)\${{ sb.SboxOutDir }}"
                $signed = "$(Build.StagingDirectory)\sandbox\build\native\${{ sb.Rid }}"
                foreach ($f in 'sbox.dll', 'v8host.exe', 'v8jsisb.dll') {
                  Copy-Item (Join-Path $signed $f) $sandboxOut -Force
                }
                $env:DEPOT_TOOLS_WIN_TOOLCHAIN = '0'
                # SBOX_ALLOW_UNSIGNED intentionally unset: enforce real signatures.
                & "$sandboxOut\test_app.exe"
                if ($LASTEXITCODE -ne 0) { Write-Error "Signed Untrusted tier FAILED (exit $LASTEXITCODE)" }
              displayName: Lockdown tier test (Untrusted, signed)
              workingDirectory: $(Build.SourcesDirectory)

        # =====================================================================
        # Node.js-source NuGet aggregator: Microsoft.JavaScript.V8. Collects the
        # per-RID pkg-staging that each Release V8JsiBuildNew_* cell uploaded and
        # runs scripts/build.ts --pack to emit the 4-pack (3 per-RID
        # Microsoft.JavaScript.V8.<rid>.nupkg + 1 meta Microsoft.JavaScript.V8.nupkg).
        # It publishes the published-packages-new artifact that the release
        # pipeline pushes.
        # =====================================================================
      - job: V8JsiCreateNugetNew
        dependsOn:
        - ${{ each matrix in parameters.BuildMatrix }}:
          - ${{ if eq(matrix.BuildConfiguration, 'Release') }}:
            - V8JsiBuildNew_${{ matrix.Name }}
          # Merge the sandbox binaries (all three RIDs) into the per-RID
          # packages.
        - ${{ each sb in parameters.SandboxMatrix }}:
          - V8JsiBuildSandbox_${{ sb.Name }}
          # scripts/build.ts --pack reads config.json.v8jsi_version for the
          # package version, so wait for the computed config.json and overlay it.
        - V8JsiComputeVersion
        displayName: Create Nuget (Node.js source)

        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: $(Build.StagingDirectory)\out\pkg
            artifactName: published-packages-new

        steps:
          # Aggregator needs source: scripts/build.ts:packNuGet stages shared
          # headers + consumer source TUs from src/, and runs the 4-pack flow
          # (3 per-RID + 1 meta) for Microsoft.JavaScript.V8.
        - checkout: self

          # Overlay the CI-computed config.json before build.ts --pack reads it.
        - template: /.ado/overlay-version-config.yml@self

        - task: UseNode@1
          displayName: Use Node.js 24.x
          inputs:
            version: '24.x'

        - task: NuGetToolInstaller@1
          displayName: Install NuGet tools
          inputs:
            versionSpec: ">=4.6.0"

          # Download each Release cell's pkg-staging (build/native/<rid>/ with
          # v8jsi.dll + import lib + PDB, plus the shared headers/TUs). Each
          # artifact is the cell's pkg-staging content, so it lands directly
          # under out/pkg-staging; merging all three gives packNuGet a complete
          # per-RID staging so the meta package's <dependencies> resolve.
        - ${{ each matrix in parameters.BuildMatrix }}:
          - ${{ if eq(matrix.BuildConfiguration, 'Release') }}:
            - task: DownloadPipelineArtifact@2
              displayName: Download ${{ matrix.Name }}-new pkg-staging
              inputs:
                artifact: ${{ matrix.Name }}-new
                path: $(Build.StagingDirectory)\out\pkg-staging

          # Merge the sandbox binaries (build/native/<rid>/ layout) into the
          # same pkg-staging so the per-RID nuspec globs pick them up. The
          # packNuGet per-platform loop hits its pre-staged-v8jsi.dll fast path
          # for these RIDs and does not re-stage, so the sandbox binaries must
          # already be in build/native/<rid>/ -- which these downloads provide.
          # Each artifact carries a distinct build/native/<rid>/ subtree, so
          # downloading all three into the same pkg-staging merges cleanly. The
          # per-RID nuspec globs tolerate a RID lacking sandbox binaries, so a
          # partial roll-out still packs.
        - ${{ each sb in parameters.SandboxMatrix }}:
          - task: DownloadPipelineArtifact@2
            displayName: Download sandbox-binaries-${{ sb.Rid }}
            inputs:
              artifact: sandbox-binaries-${{ sb.Rid }}
              path: $(Build.StagingDirectory)\out\pkg-staging

          # Pack: 3 per-RID Microsoft.JavaScript.V8.<rid>.nupkg + meta
          # Microsoft.JavaScript.V8.nupkg. No local build needed — packNuGet's
          # pre-staged binary fallback reuses the matrix-uploaded
          # build/native/<rid>/ content. A successful pack with all three
          # platforms guarantees the 4-pack, so there is no separate verify step.
          # (The release symbol jobs publish PDBs from the per-arch build
          # artifacts directly, so no symbols/ side-output is produced here.)
        - pwsh: |
            node scripts/build.ts --no-build --no-test --pack `
                --platform x86 --platform x64 --platform arm64 `
                --output-path $(Build.StagingDirectory)\out
          displayName: NuGet Pack (3 per-RID + meta)
          workingDirectory: $(Build.SourcesDirectory)

          # Sign the NuGet packages only for the CI builds.
        - ${{ if parameters.isPublish }}:
          - template: /.ado/templates/esrp-codesign-nuget.yml@self
            parameters:
              folderPath: $(Build.StagingDirectory)\out\pkg
              pattern: |
                Microsoft.JavaScript.V8.*.nupkg

        # =====================================================================
        # Signed-pack acceptance (CI only). After the 4-pack is built and ESRP-
        # signed, restore the final per-RID Microsoft.JavaScript.V8.<rid>
        # package as a real consumer and run the full tests/ suite against the
        # SIGNED bytes -- including the sandbox (v8jsisb) leg + cross-engine
        # rejection, which the in-cell --test-e2e skips (a per-RID build cell's
        # pack carries no v8jsisb.dll). This is the only stage that exercises the
        # exact signed binaries + signed .nupkg a customer restores. PR builds
        # skip it (nothing is signed there); their fast in-cell --test-e2e
        # already covers the non-sandbox legs unsigned. One job per shipped RID:
        # x64/x86 on the x64 image (x86 consumer via WOW64), arm64 native.
        # =====================================================================
      - ${{ each matrix in parameters.BuildMatrix }}:
        - ${{ if and(eq(parameters.isPublish, true), eq(matrix.BuildConfiguration, 'Release')) }}:
          - job: V8JsiAcceptanceNew_${{ matrix.Name }}
            dependsOn: V8JsiCreateNugetNew
            displayName: Acceptance signed pack ${{ matrix.Name }}

            # arm64 runs natively on the ARM64 pool; x64/x86 inherit the top-
            # level windows-2025-1espt image (x86 consumer runs via WOW64).
            ${{ if eq(matrix.BuildPlatform, 'arm64') }}:
              pool:
                name: windows-2025-1espt-arm64

            steps:
            - checkout: self

              # ARM64 agents ship no externals\node10; shim it so the mandatory
              # 1ES retention post-job (Node 10 handler) doesn't fail.
            - ${{ if eq(matrix.BuildPlatform, 'arm64') }}:
              - template: /.ado/ensure-node10-shim.yml@self

            - task: UseNode@1
              displayName: Use Node.js 24.x
              inputs:
                version: '24.x'

              # The consumer restore (run-smoke.ps1 / run-snapshot.ps1) needs
              # nuget.exe on PATH.
            - task: NuGetToolInstaller@1
              displayName: Install NuGet tools
              inputs:
                versionSpec: ">=4.6.0"

              # The final signed 4-pack (3 per-RID + meta) from the aggregator.
            - task: DownloadPipelineArtifact@2
              displayName: Download published-packages-new
              inputs:
                artifact: published-packages-new
                path: $(Build.StagingDirectory)\acceptance\pkg

              # Restore the signed per-RID package as a real consumer and run the
              # smoke + snapshot suite (both engines) against it. --test-acceptance
              # forces the sandbox leg on: the final pack MUST carry v8jsisb.dll.
            - pwsh: |
                node scripts/build.ts --no-build --no-test --test-acceptance `
                    --platform ${{ matrix.BuildPlatform }} `
                    --output-path $(Build.StagingDirectory)\acceptance
              displayName: Acceptance tests against signed pack
              workingDirectory: $(Build.SourcesDirectory)

        # =====================================================================
        # Tag published versions (publishing CI build only). After the NuGet
        # aggregators and the signed-pack acceptance jobs succeed, create a Git
        # tag on github.com/microsoft/v8-jsi for each package version this build
        # is about to publish, so every shipped version is pinned to the commit
        # it was built from. The release pipeline can't do this -- its agent
        # can't enlist sources and only sees the CI artifacts -- so tagging runs
        # here in CI, which checks out the repo.
        #
        # The shipped package gets a package-qualified tag (mirroring RNW's
        # _v<version>):
        #   Microsoft.JavaScript.V8_v<version>     (config.json .v8jsi_version)
        #
        # The versions come from the computed config.json overlaid above, so a
        # release build increments the patch per commit (git height) and each
        # commit gets its own tag. Two guards keep tagging correct:
        #   * Skip prerelease builds: a non-release branch produces a "-<sha>"
        #     suffixed version, which must never mint a real release tag.
        #   * Idempotent for re-runs of the same commit (same version): the feed
        #     membership check and the ls-remote tag check both no-op if the
        #     version is already published / already tagged. The public feed is
        #     anonymously readable, so that query needs no token; an existing tag
        #     is left untouched, never moved.
        # =====================================================================
      - ${{ if eq(parameters.isPublish, true) }}:
        - job: V8JsiTagRelease
          dependsOn:
          - V8JsiCreateNugetNew
          - ${{ each matrix in parameters.BuildMatrix }}:
            - ${{ if eq(matrix.BuildConfiguration, 'Release') }}:
              - V8JsiAcceptanceNew_${{ matrix.Name }}
          # The tag version comes from the computed config.json overlaid below.
          - V8JsiComputeVersion
          displayName: Tag published versions
          steps:
          - checkout: self

            # Overlay the CI-computed config.json so the tags carry the computed
            # per-build versions (and prerelease builds are skipped, below).
          - template: /.ado/overlay-version-config.yml@self

          - pwsh: |
              $ErrorActionPreference = 'Stop'

              # The package ships to the public ms/react-native-public feed,
              # which is anonymously readable -- no access token needed to query.
              $feedUrl = 'https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/nuget/v3/index.json'

              # Discover the flat-container (PackageBaseAddress) URL from the V3
              # index -- the same lookup the publish template uses.
              $index = Invoke-RestMethod -Uri $feedUrl
              $baseAddress = ($index.resources |
                Where-Object { $_.'@type' -like 'PackageBaseAddress*' } |
                Select-Object -First 1).'@id'
              if (-not $baseAddress) { throw "No PackageBaseAddress in $feedUrl" }
              if (-not $baseAddress.EndsWith('/')) { $baseAddress += '/' }

              # GitHub tag-push auth: the bearer header the permission POC proved.
              $authHeader = "AUTHORIZATION: bearer $env:SYSTEM_ACCESSTOKEN"
              Write-Host "##vso[task.setsecret]$authHeader"

              $config = Get-Content "$(Build.SourcesDirectory)\config.json" | ConvertFrom-Json
              $commit = "$(Build.SourceVersion)"

              # One package-qualified tag for the shipped package.
              $families = @(
                @{ Id = 'Microsoft.JavaScript.V8';   Version = [string]$config.v8jsi_version }
              )

              foreach ($f in $families) {
                $id = $f.Id
                $version = $f.Version
                Write-Host "=== $id $version ==="
                if ([string]::IsNullOrWhiteSpace($version)) { throw "Missing version for $id in config.json" }

                # Release tags only. compute-version.ts appends a "-g<sha>"
                # prerelease suffix on non-release branches, so a suffixed
                # version marks a non-release build (a PR or a topic branch that
                # publishes for testing) -- those must never mint a real release
                # tag. A clean version therefore implies a release branch.
                if ($version -match '-') {
                  Write-Host "  $version is a prerelease build -- no release tag."
                  continue
                }

                # Already on the public feed? Membership test, so feed ordering
                # does not matter. 404 = never published -> treat as new.
                $versionsUrl = "$baseAddress$($id.ToLower())/index.json"
                $published = $false
                try {
                  $result = Invoke-RestMethod -Uri $versionsUrl -ErrorAction Stop
                  if ($version.ToLower() -in $result.versions) { $published = $true }
                } catch {
                  if ($_.Exception.Response.StatusCode -ne [System.Net.HttpStatusCode]::NotFound) { throw }
                }
                if ($published) {
                  Write-Host "  $version already on the feed -- no tag needed."
                  continue
                }

                $tag = "${id}_v${version}"

                # Idempotent: never move an existing tag.
                $existing = git -c http.extraheader="$authHeader" ls-remote --tags origin "refs/tags/$tag"
                if ($LASTEXITCODE -ne 0) { Write-Error "ls-remote failed for $tag"; exit 1 }
                if ($existing) {
                  Write-Host "  tag '$tag' already exists -- no-op."
                  continue
                }

                Write-Host "  creating tag '$tag' at $commit"
                git tag $tag $commit
                if ($LASTEXITCODE -ne 0) { Write-Error "git tag failed for $tag"; exit 1 }
                git -c http.extraheader="$authHeader" push origin "refs/tags/$tag"
                if ($LASTEXITCODE -ne 0) { Write-Error "git push failed for $tag"; exit 1 }
                Write-Host "  pushed $tag"
              }
            displayName: Create and push release tags
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
