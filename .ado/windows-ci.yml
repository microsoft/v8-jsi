name: v8jsi_ci_0.0.$(Date:yyMM.d)$(Rev:rrr)

# Triggers are defined here, not in the ADO pipeline UI. CI runs on main and
# skips changes that only touch the documentation and ownership-metadata files
# excluded below. PR validation is handled separately by windows-pr.yml, so this
# pipeline sets pr: none.
trigger:
  batch: false
  branches:
    include:
    - main
  paths:
    exclude:
    - README.md
    - docs/*
    - AGENTS.md
    - CLAUDE.md
    - CODEOWNERS
pr: none

# Monthly keep-alive run so ADO does not disable the pipeline for inactivity.
# It is not used for real releases and its time is not significant. A successful
# run still triggers windows-release.yml, which skips versions already published.
schedules:
- cron: '0 9 1 * *'
  displayName: Monthly keep-alive
  branches:
    include:
    - main
  always: true

variables:
  - name: tags
    value: production,externalfacing

# Temporary agent probe for the libnode build. Not for merging.
extends:
  template: libnode-probe.yml@self