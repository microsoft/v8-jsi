name: v8jsi_ci_0.0.$(Date:yyMM.d)$(Rev:rrr)

# Test-branch-only CET availability probe; never merged.
trigger: none
pr: none

resources:
  repositories:
  - repository: OfficePipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    featureFlags:
      autoEnablePREfastWithNewRuleset: false
    pool:
      name: fabric-internal-pool-large
      demands: ImageOverride -equals windows-2025-1espt
    sdl:
      prefast:
        enabled: false
        justificationForDisabling: "Probe only."
    stages:
    - stage: probe
      jobs:
      - job: fabric_large
        displayName: CET probe fabric-internal-pool-large
        pool:
          name: fabric-internal-pool-large
          demands: ImageOverride -equals windows-2025-1espt
          os: windows
        steps:
        - pwsh: .ado/cet-probe.ps1
          displayName: Probe
      - job: exd_latest
        displayName: CET probe ExDShared windows-latest
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          vmImage: windows-latest
          os: windows
        steps:
        - pwsh: .ado/cet-probe.ps1
          displayName: Probe
      - job: exd_2025
        displayName: CET probe ExDShared windows-2025
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          vmImage: windows-2025
          os: windows
        steps:
        - pwsh: .ado/cet-probe.ps1
          displayName: Probe