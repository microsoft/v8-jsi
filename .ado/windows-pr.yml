name: v8jsi_pr_0.0.$(Date:yyMM.d)$(Rev:rrr)

# Triggers are defined here, not in the ADO pipeline UI.
trigger: none
pr:
  - main

# Monthly keep-alive run so ADO does not disable the pipeline for inactivity.
# It is not used for real releases and its time is not significant.
schedules:
- cron: '0 9 1 * *'
  displayName: Monthly keep-alive
  branches:
    include:
    - main
  always: true

variables:
    # Forked-repo PRs can't run Guardian/SDL and emit a noisy "not supported for
    # forked repositories" warning; suppress it. (Set here, not in the shared
    # windows-jobs.yml, which extends a template and can't declare root variables.)
  - name: GDN_SUPPRESS_FORKED_BUILD_WARNING
    value: true

extends:
  template: windows-jobs.yml@self
  parameters:
    # PR builds must pass false.
    isPublish: false
    # It must be false for real builds. Use true only for the build pipeline debugging.
    fakeBuild: false
